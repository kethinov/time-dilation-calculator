<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Time dilation calculator</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/semantic-forms@5.3.8/dist/semantic-forms.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/semantic-forms@5.3.8/dist/semantic-forms.js" defer></script>
  <style>
    body {
      font-family: Inter, sans-serif;
    }
    form {
      max-width: 480px;
    }
    form.semanticForms {
      --semanticFormsInputFontSize: 15px;
      --semanticFormsFontFamily: Inter, sans-serif;
    }
    form.semanticForms .hiddenField {
      display: none;
    }
  </style>
</head>
<body>
  <noscript><h1>You can't fly through space at high speeds without JavaScript enabled.</h1></noscript>
  <form class="semanticForms" id="time_dilation_calculator">
    <fieldset>
      <legend>Time dilation calculator</legend>
      <dl class="colspan-1">
        <div>
          <dt><label for="mission_profile">Mission profile</label></dt>
          <dd><select id="mission_profile" name="mission_profile">
            <option value="flip">Constant acceleration, flip and burn (arrive at rest)</option>
            <option value="burn">Constant acceleration, burning the whole way</option>
            <option value="velocity">Constant velocity</option>
          </select></dd>
        </div>
        <div>
          <dt><label for="spaceship_time">Time spent traveling</label></dt>
          <dd><input type="number" id="spaceship_time" name="spaceship_time" step=".01" value="43" placeholder="e.g. 43">
          <label for="spaceship_time">Time as measured aboard the spacecraft.</label></dd>
        </div>
        <div>
          <dt><label for="spaceship_time_unit">Unit of time</label></dt>
          <dd><select id="spaceship_time_unit" name="spaceship_time_unit">
            <option value="Hours">Hours</option>
            <option value="Days" selected>Days</option>
            <option value="Months">Months (simplified as 30 days)</option>
            <option value="Years">Years</option>
          </select></dd>
        </div>
        <div class="velocityField">
          <dt><label for="spaceship_speed">% light speed</label></dt>
          <dd><input type="number" id="spaceship_speed" name="spaceship_speed" min="0" max="99.999999999" step=".0000000001" value="37" placeholder="e.g. 37">
          <label for="spaceship_speed">Percentage of the speed of light the spacecraft traveled.</label></dd>
        </div>
        <div class="accelField">
          <dt><label for="spaceship_accel">Acceleration (g)</label></dt>
          <dd><input type="number" id="spaceship_accel" name="spaceship_accel" min="0" step=".01" value="1" placeholder="e.g. 1">
          <label for="spaceship_accel">Thrust felt aboard the spacecraft, in Earth gravities. 1 g is the surface gravity of Earth.</label></dd>
        </div>
      </dl>
      <menu>
        <li><button type="submit" name="submit">Calculate</button></li>
      </menu>
      <output></output>
    </fieldset>
  </form>
  <script>
    window.addEventListener('load', () => {
      window.semanticForms()
    })
  </script>
  <script src="calculator.js"></script>
  <p><a href="https://github.com/kethinov/time-dilation-calculator">Source code on GitHub</a></p>
</body>
</html>
